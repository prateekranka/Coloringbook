  <!-- Building 8 — narrow right edge -->
  <rect id="bldg_8" x="1800" y="860" width="180" height="620" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_8_w1" x="1826" y="900"  width="50" height="50" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_8_w2" x="1904" y="900"  width="50" height="50" stroke="black" stroke-width="2" fill="none"/>
