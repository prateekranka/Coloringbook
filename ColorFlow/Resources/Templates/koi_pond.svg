<?xml version="1.0" encoding="UTF-8"?>
<!-- Koi Pond — Animals template for ColorFlow -->
<!-- Two koi fish swimming in a circular pond with lily pads -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Pond water (outer edge) -->
  <circle id="pond_outer" cx="1024" cy="1024" r="960" stroke="black" stroke-width="3" fill="none"/>

  <!-- Pond water (inner — the water itself) -->
  <circle id="pond_water" cx="1024" cy="1024" r="900" stroke="black" stroke-width="3" fill="none"/>

  <!-- Decorative stone border ring between inner/outer -->
  <circle id="stone_1" cx="1024"  cy="84"   r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_2" cx="1504"  cy="228"  r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_3" cx="1820"  cy="620"  r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_4" cx="1940"  cy="1024" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_5" cx="1820"  cy="1428" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_6" cx="1504"  cy="1820" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_7" cx="1024"  cy="1964" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_8" cx="544"   cy="1820" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_9" cx="228"   cy="1428" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_10" cx="108"  cy="1024" r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_11" cx="228"  cy="620"  r="48" stroke="black" stroke-width="3" fill="none"/>
  <circle id="stone_12" cx="544"  cy="228"  r="48" stroke="black" stroke-width="3" fill="none"/>

  <!-- ── Orange Koi (swimming right-to-left arc) ─────────────────────── -->

  <!-- Body -->
  <path id="koi_orange_body" stroke="black" stroke-width="3" fill="none"
    d="M 1320,680
       C 1380,580 1480,520 1560,540
       C 1620,556 1660,610 1640,680
       C 1620,750 1560,800 1480,820
       C 1380,844 1260,820 1200,760
       C 1160,720 1180,660 1240,640
       Z"/>

  <!-- Head -->
  <circle id="koi_orange_head" cx="1560" cy="610" r="80" stroke="black" stroke-width="3" fill="none"/>

  <!-- Eye -->
  <circle id="koi_orange_eye" cx="1590" cy="590" r="22" stroke="black" stroke-width="3" fill="none"/>
  <circle id="koi_orange_pupil" cx="1596" cy="586" r="10" stroke="black" stroke-width="2" fill="none"/>

  <!-- Dorsal fin -->
  <path id="koi_orange_dorsal" stroke="black" stroke-width="3" fill="none"
    d="M 1400,640 C 1380,520 1460,500 1500,580 L 1460,660 Z"/>

  <!-- Tail -->
  <path id="koi_orange_tail_top" stroke="black" stroke-width="3" fill="none"
    d="M 1200,720 C 1100,640 1060,560 1100,500 L 1200,680 Z"/>
  <path id="koi_orange_tail_bot" stroke="black" stroke-width="3" fill="none"
    d="M 1200,760 C 1100,840 1060,920 1100,980 L 1200,800 Z"/>

  <!-- Scale markings (small ellipses as regions) -->
  <ellipse id="koi_o_scale_1" cx="1380" cy="680" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>
  <ellipse id="koi_o_scale_2" cx="1440" cy="730" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>
  <ellipse id="koi_o_scale_3" cx="1340" cy="740" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>

  <!-- ── White/Black Koi (swimming opposite arc) ──────────────────────── -->

  <!-- Body -->
  <path id="koi_white_body" stroke="black" stroke-width="3" fill="none"
    d="M 740,1360
       C 680,1460 580,1520 500,1500
       C 440,1484 400,1430 420,1360
       C 440,1290 500,1240 580,1220
       C 680,1196 800,1220 860,1280
       C 900,1320 880,1380 820,1400
       Z"/>

  <!-- Head -->
  <circle id="koi_white_head" cx="500" cy="1430" r="80" stroke="black" stroke-width="3" fill="none"/>

  <!-- Eye -->
  <circle id="koi_white_eye" cx="472" cy="1450" r="22" stroke="black" stroke-width="3" fill="none"/>
  <circle id="koi_white_pupil" cx="466" cy="1454" r="10" stroke="black" stroke-width="2" fill="none"/>

  <!-- Dorsal fin -->
  <path id="koi_white_dorsal" stroke="black" stroke-width="3" fill="none"
    d="M 660,1400 C 680,1520 600,1540 560,1460 L 600,1380 Z"/>

  <!-- Tail -->
  <path id="koi_white_tail_top" stroke="black" stroke-width="3" fill="none"
    d="M 860,1320 C 960,1400 1000,1480 960,1540 L 860,1360 Z"/>
  <path id="koi_white_tail_bot" stroke="black" stroke-width="3" fill="none"
    d="M 860,1280 C 960,1200 1000,1120 960,1060 L 860,1240 Z"/>

  <!-- Scale markings -->
  <ellipse id="koi_w_scale_1" cx="680" cy="1360" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>
  <ellipse id="koi_w_scale_2" cx="620" cy="1310" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>
  <ellipse id="koi_w_scale_3" cx="720" cy="1300" rx="40" ry="28" stroke="black" stroke-width="2" fill="none"/>

  <!-- ── Lily Pads ───────────────────────────────────────────────────── -->

  <!-- Lily pad 1 (top-left area) -->
  <circle id="lily_1" cx="500" cy="600" r="130" stroke="black" stroke-width="3" fill="none"/>
  <!-- Lily pad 1 cut (the notch — decorative line only, no id) -->
  <path stroke="black" stroke-width="3" fill="none"
    d="M 500,600 L 500,470"/>

  <!-- Lily pad 2 (bottom-right) -->
  <circle id="lily_2" cx="1560" cy="1440" r="110" stroke="black" stroke-width="3" fill="none"/>
  <path stroke="black" stroke-width="3" fill="none"
    d="M 1560,1440 L 1560,1330"/>

  <!-- Lily pad 3 (center-left) -->
  <circle id="lily_3" cx="680" cy="1060" r="90" stroke="black" stroke-width="3" fill="none"/>
  <path stroke="black" stroke-width="3" fill="none"
    d="M 680,1060 L 680,970"/>

  <!-- Lily flower on pad 1 -->
  <circle id="lily_flower_1" cx="500" cy="560" r="40" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="lily_petal_1a" points="500,516 512,550 488,550" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_1b" points="544,560 510,572 510,548" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_1c" points="500,604 488,570 512,570" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_1d" points="456,560 490,548 490,572" stroke="black" stroke-width="2" fill="none"/>

  <!-- Lily flower on pad 2 -->
  <circle id="lily_flower_2" cx="1560" cy="1400" r="35" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="lily_petal_2a" points="1560,1362 1571,1394 1549,1394" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_2b" points="1598,1400 1566,1411 1566,1389" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_2c" points="1560,1438 1549,1406 1571,1406" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="lily_petal_2d" points="1522,1400 1554,1389 1554,1411" stroke="black" stroke-width="2" fill="none"/>

  <!-- Water ripple rings around the koi -->
  <path id="ripple_a1" stroke="black" stroke-width="2" fill="none"
    d="M 1040,800 C 1080,780 1120,800 1100,840 C 1080,880 1020,880 1000,840 C 980,800 1000,780 1040,800 Z"/>

  <path id="ripple_b1" stroke="black" stroke-width="2" fill="none"
    d="M 1020,1240 C 1060,1220 1100,1240 1080,1280
       C 1060,1320 1000,1320 980,1280
       C 960,1240 980,1220 1020,1240 Z"/>

</svg>
