  <rect id="bldg_3" x="500" y="380" width="240" height="1100" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_3_w1" x="526" y="420" width="80" height="70" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_3_w2" x="634" y="420" width="80" height="70" stroke="black" stroke-width="2" fill="none"/>
