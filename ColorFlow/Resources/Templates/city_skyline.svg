  <rect id="bldg_4_base"  x="740" y="760" width="260" height="720" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_4_mid"   x="770" y="640" width="200" height="120" stroke="black" stroke-width="3" fill="none"/>
