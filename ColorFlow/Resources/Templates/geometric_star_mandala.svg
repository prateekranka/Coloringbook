<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <!-- Geometric Star Mandala — 8-pointed star with nested polygons -->

  <!-- Outer 8-pointed star -->
  <path id="region-1" d="M400,50 L440,200 L550,130 L480,250 L650,250 L530,340 L650,430 L490,400 L550,560 L420,470 L400,640 L380,470 L250,560 L310,400 L150,430 L270,340 L150,250 L320,250 L250,130 L360,200 Z" fill="none" stroke="black" stroke-width="3"/>

  <!-- Middle octagon -->
  <path id="region-2" d="M400,180 L480,210 L530,280 L530,370 L490,440 L410,470 L320,440 L270,370 L270,280 L320,210 Z" fill="none" stroke="black" stroke-width="3"/>

  <!-- Star point fills (8 triangles between star and octagon) -->
  <path id="region-3"  d="M400,50 L440,200 L400,180 L360,200 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-4"  d="M550,130 L480,250 L530,280 L530,240 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-5"  d="M650,250 L530,340 L530,370 L570,360 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-6"  d="M550,560 L490,440 L530,440 L570,500 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-7"  d="M400,640 L380,470 L400,480 L420,470 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-8"  d="M250,560 L270,440 L310,440 L260,500 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-9"  d="M150,430 L270,370 L270,390 L220,430 Z" fill="none" stroke="black" stroke-width="3"/>
  <path id="region-10" d="M150,250 L270,280 L270,260 L210,230 Z" fill="none" stroke="black" stroke-width="3"/>

  <!-- Inner square -->
  <path id="region-11" d="M400,250 L500,340 L430,470 L320,450 L280,330 Z" fill="none" stroke="black" stroke-width="3"/>

  <!-- Center diamond -->
  <path id="region-12" d="M400,300 L450,370 L400,440 L350,370 Z" fill="none" stroke="black" stroke-width="3"/>
</svg>
