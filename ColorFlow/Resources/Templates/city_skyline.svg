<?xml version="1.0" encoding="UTF-8"?>
<!-- City Skyline — Architecture template for ColorFlow -->
<!-- All shapes with id attributes are fillable regions -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Sky -->
  <rect id="sky" x="0" y="0" width="2048" height="1480" stroke="black" stroke-width="3" fill="none"/>

  <!-- Moon -->
  <circle id="moon" cx="1820" cy="180" r="130" stroke="black" stroke-width="3" fill="none"/>

  <!-- Stars (small circles, treated as decorative regions) -->
  <circle id="star_1" cx="200"  cy="120" r="12" stroke="black" stroke-width="2" fill="none"/>
  <circle id="star_2" cx="500"  cy="80"  r="10" stroke="black" stroke-width="2" fill="none"/>
  <circle id="star_3" cx="900"  cy="150" r="14" stroke="black" stroke-width="2" fill="none"/>
  <circle id="star_4" cx="1250" cy="95"  r="11" stroke="black" stroke-width="2" fill="none"/>
  <circle id="star_5" cx="1550" cy="60"  r="13" stroke="black" stroke-width="2" fill="none"/>

  <!-- Road / ground -->
  <rect id="road" x="0" y="1480" width="2048" height="568" stroke="black" stroke-width="3" fill="none"/>

  <!-- Road center divider lines (decorative, no id) -->
  <rect x="0" y="1600" width="2048" height="20" stroke="black" stroke-width="2" fill="none"/>

  <!-- Sidewalk strip -->
  <rect id="sidewalk" x="0" y="1480" width="2048" height="60" stroke="black" stroke-width="3" fill="none"/>

  <!-- ── Buildings (left to right) ─────────────────────────────────── -->

  <!-- Building 1 — narrow tall -->
  <rect id="bldg_1" x="40" y="620" width="180" height="860" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_1_w1" x="66"  y="660" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_1_w2" x="138" y="660" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_1_w3" x="66"  y="760" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_1_w4" x="138" y="760" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_1_w5" x="66"  y="860" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_1_w6" x="138" y="860" width="56" height="56" stroke="black" stroke-width="2" fill="none"/>
  <!-- Rooftop antenna -->
  <rect id="bldg_1_antenna" x="118" y="560" width="24" height="60" stroke="black" stroke-width="2" fill="none"/>
  <circle id="bldg_1_antenna_ball" cx="130" cy="552" r="12" stroke="black" stroke-width="2" fill="none"/>

  <!-- Building 2 — wide medium -->
  <rect id="bldg_2" x="220" y="820" width="280" height="660" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_2_w1" x="250" y="860" width="72" height="64" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_2_w2" x="358" y="860" width="72" height="64" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_2_w3" x="250" y="970" width="72" height="64" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_2_w4" x="358" y="970" width="72" height="64" stroke="black" stroke-width="2" fill="none"/>
