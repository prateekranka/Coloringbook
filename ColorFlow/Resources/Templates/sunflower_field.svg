<?xml version="1.0" encoding="UTF-8"?>
<!-- Sunflower Field — Botanicals template for ColorFlow -->
<!-- Three sunflowers with leaves and stems, set against sky and soil -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Sky -->
  <rect id="sky" x="0" y="0" width="2048" height="1380" stroke="black" stroke-width="3" fill="none"/>

  <!-- Sun / Light source -->
  <circle id="sun" cx="1880" cy="220" r="170" stroke="black" stroke-width="3" fill="none"/>

  <!-- Cloud -->
  <path id="cloud" stroke="black" stroke-width="3" fill="none"
    d="M 200,200 C 200,150 240,118 290,118
       C 308,88 348,74 384,90
       C 402,64 440,52 472,66
       C 504,52 538,70 544,106
       C 580,111 602,139 594,170
       C 594,188 572,200 544,204
       L 222,204 C 202,204 189,196 189,182 Z"/>

  <!-- Soil / ground -->
  <rect id="soil" x="0" y="1380" width="2048" height="668" stroke="black" stroke-width="3" fill="none"/>

  <!-- Soil texture bands -->
  <rect id="topsoil" x="0" y="1380" width="2048" height="100" stroke="black" stroke-width="2" fill="none"/>

  <!-- ── Left Sunflower ──────────────────────────────────────────────── -->

  <!-- Stem -->
  <rect id="stem_left" x="300" y="900" width="50" height="480" stroke="black" stroke-width="3" fill="none"/>

  <!-- Leaf left-lower -->
  <path id="leaf_left_ll" stroke="black" stroke-width="3" fill="none"
    d="M 350,1180 C 450,1140 520,1080 490,980
       C 420,1020 370,1080 350,1180 Z"/>

  <!-- Leaf left-upper -->
  <path id="leaf_left_ul" stroke="black" stroke-width="3" fill="none"
    d="M 300,1050 C 180,1000 110,940 140,840
       C 210,870 270,940 300,1050 Z"/>

  <!-- Petals — left flower (8 petals using polygon approximation) -->
  <polygon id="petal_l1" points="325,500 350,660 300,660" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l2" points="440,530 420,690 340,640" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l3" points="510,620 460,770 400,700" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l4" points="520,730 440,860 390,800" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l5" points="325,820 350,660 300,660" stroke="black" stroke-width="3" fill="none"/>  <!-- bottom -->
  <polygon id="petal_l6" points="210,730 270,860 220,860" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l7" points="140,620 190,770 250,700" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_l8" points="210,530 230,690 310,640" stroke="black" stroke-width="3" fill="none"/>

  <!-- Flower head (outer) -->
  <circle id="flower_head_left_outer" cx="325" cy="710" r="200" stroke="black" stroke-width="3" fill="none"/>

  <!-- Flower face (inner disc) -->
  <circle id="flower_disc_left" cx="325" cy="710" r="130" stroke="black" stroke-width="3" fill="none"/>

  <!-- Seed pattern rings -->
  <circle id="flower_seed_left_1" cx="325" cy="710" r="80" stroke="black" stroke-width="2" fill="none"/>
  <circle id="flower_seed_left_2" cx="325" cy="710" r="40" stroke="black" stroke-width="2" fill="none"/>

  <!-- ── Center Sunflower (tallest) ─────────────────────────────────── -->

  <rect id="stem_center" x="999" y="760" width="50" height="620" stroke="black" stroke-width="3" fill="none"/>

  <path id="leaf_center_right" stroke="black" stroke-width="3" fill="none"
    d="M 1049,1080 C 1160,1040 1240,970 1200,860
       C 1120,900 1060,980 1049,1080 Z"/>

  <path id="leaf_center_left" stroke="black" stroke-width="3" fill="none"
    d="M 999,950 C 880,910 800,840 840,730
       C 920,770 975,850 999,950 Z"/>

  <!-- Center flower petals (10 petals) -->
  <polygon id="petal_c1"  points="1024,280 1055,490 993,490"  stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c2"  points="1170,318 1120,528 1048,466" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c3"  points="1272,430 1190,614 1124,548" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c4"  points="1308,578 1190,736 1140,660" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c5"  points="1272,726 1128,836 1100,760" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c6"  points="1024,784 993,574 1055,574"  stroke="black" stroke-width="3" fill="none"/>  <!-- bottom -->
  <polygon id="petal_c7"  points="776,726 920,836 948,760"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c8"  points="740,578 858,736 908,660"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c9"  points="776,430 858,614 924,548"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_c10" points="878,318 928,528 1000,466"   stroke="black" stroke-width="3" fill="none"/>

  <circle id="flower_head_center_outer" cx="1024" cy="530" r="240" stroke="black" stroke-width="3" fill="none"/>
  <circle id="flower_disc_center"       cx="1024" cy="530" r="155" stroke="black" stroke-width="3" fill="none"/>
  <circle id="flower_seed_c1"           cx="1024" cy="530" r="95"  stroke="black" stroke-width="2" fill="none"/>
  <circle id="flower_seed_c2"           cx="1024" cy="530" r="46"  stroke="black" stroke-width="2" fill="none"/>

  <!-- ── Right Sunflower ────────────────────────────────────────────── -->

  <rect id="stem_right" x="1698" y="920" width="50" height="460" stroke="black" stroke-width="3" fill="none"/>

  <path id="leaf_right_rl" stroke="black" stroke-width="3" fill="none"
    d="M 1698,1160 C 1590,1120 1520,1060 1550,960
       C 1622,1000 1672,1070 1698,1160 Z"/>

  <path id="leaf_right_rr" stroke="black" stroke-width="3" fill="none"
    d="M 1748,1040 C 1868,1000 1950,940 1920,840
       C 1848,870 1780,940 1748,1040 Z"/>

  <!-- Right flower petals (8 petals) -->
  <polygon id="petal_r1" points="1723,540 1748,700 1698,700" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r2" points="1838,570 1818,730 1738,680" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r3" points="1908,660 1858,810 1798,740" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r4" points="1918,770 1838,900 1788,840" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r5" points="1723,960 1748,800 1698,800" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r6" points="1608,770 1668,900 1618,900" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r7" points="1538,660 1588,810 1648,740" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="petal_r8" points="1608,570 1628,730 1708,680" stroke="black" stroke-width="3" fill="none"/>

  <circle id="flower_head_right_outer" cx="1723" cy="750" r="200" stroke="black" stroke-width="3" fill="none"/>
  <circle id="flower_disc_right"       cx="1723" cy="750" r="130" stroke="black" stroke-width="3" fill="none"/>
  <circle id="flower_seed_r1"          cx="1723" cy="750" r="80"  stroke="black" stroke-width="2" fill="none"/>
  <circle id="flower_seed_r2"          cx="1723" cy="750" r="40"  stroke="black" stroke-width="2" fill="none"/>

  <!-- Ground grass tufts (small regions along soil boundary) -->
  <path id="grass_1" stroke="black" stroke-width="3" fill="none"
    d="M 100,1380 C 105,1330 118,1310 130,1380 Z"/>
  <path id="grass_2" stroke="black" stroke-width="3" fill="none"
    d="M 570,1380 C 575,1325 590,1305 604,1380 Z"/>
  <path id="grass_3" stroke="black" stroke-width="3" fill="none"
    d="M 800,1380 C 805,1335 818,1316 830,1380 Z"/>
  <path id="grass_4" stroke="black" stroke-width="3" fill="none"
    d="M 1240,1380 C 1245,1328 1260,1308 1272,1380 Z"/>
  <path id="grass_5" stroke="black" stroke-width="3" fill="none"
    d="M 1480,1380 C 1485,1332 1500,1312 1512,1380 Z"/>
  <path id="grass_6" stroke="black" stroke-width="3" fill="none"
    d="M 1950,1380 C 1955,1330 1968,1310 1980,1380 Z"/>

</svg>
