  <rect id="water_tower_body" x="1370" y="560" width="100" height="80" stroke="black" stroke-width="2" fill="none"/>
  <polygon id="water_tower_roof" points="1360,560 1480,560 1470,530 1370,530" stroke="black" stroke-width="2" fill="none"/>

  <!-- Building 7 — short stepped pyramid top -->
  <rect id="bldg_7" x="1580" y="780" width="220" height="700" stroke="black" stroke-width="3" fill="none"/>
  <rect id="bldg_7_step1" x="1600" y="700" width="180" height="80" stroke="black" stroke-width="3" fill="none"/>
