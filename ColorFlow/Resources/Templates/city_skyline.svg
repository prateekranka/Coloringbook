  <rect id="bldg_6_w2" x="1480" y="680" width="72" height="80" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_6_w3" x="1348" y="810" width="72" height="80" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_6_w4" x="1480" y="810" width="72" height="80" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_6_w5" x="1348" y="940" width="72" height="80" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_6_w6" x="1480" y="940" width="72" height="80" stroke="black" stroke-width="2" fill="none"/>
