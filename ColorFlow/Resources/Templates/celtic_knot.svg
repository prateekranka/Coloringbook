<?xml version="1.0" encoding="UTF-8"?>
<!-- Celtic Knot Star — Mandalas template for ColorFlow -->
<!-- Geometric interlocking design using straight paths and polygons -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Background region (outer ring area) -->
  <circle id="bg_ring" cx="1024" cy="1024" r="980" stroke="black" stroke-width="3" fill="none"/>

  <!-- Outer decorative ring border -->
  <circle id="border_outer" cx="1024" cy="1024" r="920" stroke="black" stroke-width="3" fill="none"/>

  <!-- Outer band fill region -->
  <circle id="band_outer" cx="1024" cy="1024" r="860" stroke="black" stroke-width="3" fill="none"/>

  <!-- 12-point star outer points (alternating large/small triangles) -->
  <!-- Large outer points (pointing out) -->
  <polygon id="point_1"  points="1024,104 1070,300 978,300"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_2"  points="1534,198 1438,374 1346,278"  stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_3"  points="1850,514 1674,514 1770,420"  stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_4"  points="1944,1024 1748,978 1748,1070" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_5"  points="1850,1534 1770,1628 1674,1534" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_6"  points="1534,1850 1346,1770 1438,1674" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_7"  points="1024,1944 978,1748 1070,1748" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_8"  points="514,1850 610,1674 706,1770"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_9"  points="198,1534 374,1438 374,1534"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_10" points="104,1024 300,1070 300,978"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_11" points="198,514 374,514 278,610"      stroke="black" stroke-width="3" fill="none"/>
  <polygon id="point_12" points="514,198 706,278 610,374"      stroke="black" stroke-width="3" fill="none"/>

  <!-- Inner 12-pointed star body — outer ring of segments -->
  <polygon id="seg_1"  points="1024,290 1140,450 908,450"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_2"  points="1338,378 1376,574 1190,474"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_3"  points="1574,514 1524,706 1390,562"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_4"  points="1758,838 1540,906 1574,700"   stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_5"  points="1758,1210 1574,1348 1540,1142" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_6"  points="1574,1534 1390,1486 1524,1342" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_7"  points="1338,1670 1190,1574 1376,1474" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_8"  points="1024,1758 908,1598 1140,1598"  stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_9"  points="710,1670 672,1474 858,1574"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_10" points="474,1534 524,1342 658,1486"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_11" points="290,1210 508,1142 474,1348"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_12" points="290,838 474,700 508,906"       stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_13" points="474,514 658,562 524,706"       stroke="black" stroke-width="3" fill="none"/>
  <polygon id="seg_14" points="710,378 858,474 672,574"       stroke="black" stroke-width="3" fill="none"/>

  <!-- Knot weave — inner hexagonal band regions -->
  <polygon id="weave_a" points="1024,480 1220,596 1220,828 1024,944 828,828 828,596"
           stroke="black" stroke-width="3" fill="none"/>
  <polygon id="weave_b" points="1024,600 1170,686 1170,858 1024,944 878,858 878,686"
           stroke="black" stroke-width="3" fill="none"/>

  <!-- Inner connecting band (the knotwork interlace) — 6 rhombus segments -->
  <polygon id="knot_n"  points="1024,596 1116,710 1024,824 932,710"  stroke="black" stroke-width="3" fill="none"/>
  <polygon id="knot_ne" points="1170,686 1260,806 1150,858 1074,734" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="knot_se" points="1170,858 1150,990 1024,1008 1074,878" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="knot_s"  points="1024,944 932,1058 1024,1104 1116,1058" stroke="black" stroke-width="3" fill="none"/>
  <polygon id="knot_sw" points="878,858 806,990 878,1050 974,878"    stroke="black" stroke-width="3" fill="none"/>
  <polygon id="knot_nw" points="878,686 750,790 806,858 974,734"     stroke="black" stroke-width="3" fill="none"/>

  <!-- Center medallion -->
  <circle id="center_ring" cx="1024" cy="1024" r="180" stroke="black" stroke-width="3" fill="none"/>
  <circle id="center_inner" cx="1024" cy="1024" r="110" stroke="black" stroke-width="3" fill="none"/>
  <circle id="center_dot"   cx="1024" cy="1024" r="50"  stroke="black" stroke-width="3" fill="none"/>

  <!-- Outer corner fillets (the 4 corner regions of the square border) -->
  <path id="corner_tl" stroke="black" stroke-width="3" fill="none"
    d="M 104,104 L 300,104 C 300,290 200,380 104,380 Z"/>
  <path id="corner_tr" stroke="black" stroke-width="3" fill="none"
    d="M 1944,104 L 1748,104 C 1748,290 1848,380 1944,380 Z"/>
  <path id="corner_bl" stroke="black" stroke-width="3" fill="none"
    d="M 104,1944 L 300,1944 C 300,1758 200,1668 104,1668 Z"/>
  <path id="corner_br" stroke="black" stroke-width="3" fill="none"
    d="M 1944,1944 L 1748,1944 C 1748,1758 1848,1668 1944,1668 Z"/>

</svg>
