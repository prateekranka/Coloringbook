name: TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - claude/colorflow-planning-BPoIr

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    name: Build and Upload
    runs-on: macos-26
    timeout-minutes: 45

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      APPLE_TEAM_ID: 4JRB53LG5C
      PROJECT: ColorFlow.xcodeproj
      SCHEME: ColorFlow
      TESTFLIGHT_GROUPS: ${{ vars.TESTFLIGHT_GROUPS || secrets.TESTFLIGHT_GROUPS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Validate App Store Connect secrets
        run: |
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_KEY_P8_BASE64"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Write App Store Connect API key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 -D > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        run: ./dev gen

      - name: Run unit tests
        if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip unit tests]') }}
        run: ./dev test

      - name: Clean stale CI signing certificates
        run: |
          bundle exec ruby <<'RUBY'
          require "base64"
          require "json"
          require "net/http"
          require "openssl"
          require "time"
          require "uri"
          require "jwt"

          key = OpenSSL::PKey::EC.new(Base64.decode64(ENV.fetch("ASC_KEY_P8_BASE64")))
          token = JWT.encode(
            { iss: ENV.fetch("ASC_ISSUER_ID"), iat: Time.now.to_i - 60, exp: Time.now.to_i + 900, aud: "appstoreconnect-v1" },
            key,
            "ES256",
            kid: ENV.fetch("ASC_KEY_ID"),
            typ: "JWT"
          )

          def request(uri, token, method: Net::HTTP::Get)
            http = Net::HTTP.new(uri.host, uri.port)
            http.use_ssl = true
            req = method.new(uri)
            req["Authorization"] = "Bearer #{token}"
            http.request(req)
          end

          uri = URI("https://api.appstoreconnect.apple.com/v1/certificates")
          uri.query = URI.encode_www_form("filter[certificateType]" => "IOS_DEVELOPMENT", "limit" => "200")
          response = request(uri, token)
          abort "Certificate list failed: #{response.code} #{response.body}" unless response.is_a?(Net::HTTPSuccess)

          certificates = JSON.parse(response.body).fetch("data", [])
          stale = certificates.select do |certificate|
            attrs = certificate.fetch("attributes", {})
            attrs.fetch("displayName", "").include?("Created via API")
          end.sort_by { |certificate| certificate.fetch("attributes", {}).fetch("expirationDate", "") }

          puts "Found #{stale.length} CI-created iOS development certificates to revoke."
          stale.each do |certificate|
            delete_uri = URI("https://api.appstoreconnect.apple.com/v1/certificates/#{certificate.fetch("id")}")
            delete_response = request(delete_uri, token, method: Net::HTTP::Delete)
            abort "Certificate revoke failed for #{certificate.fetch("id")}: #{delete_response.code} #{delete_response.body}" unless delete_response.code == "204"
            puts "Revoked #{certificate.fetch("id")} #{certificate.fetch("attributes", {}).fetch("displayName", "")}"
          end
          RUBY

      - name: Prepare export options
        run: |
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          cp ExportOptions.plist "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :method app-store-connect" "$EXPORT_OPTIONS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :destination export" "$EXPORT_OPTIONS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :destination string export" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :signingStyle automatic" "$EXPORT_OPTIONS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" "$EXPORT_OPTIONS" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"

      - name: Archive release build
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/ColorFlow.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ColorFlow.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Prepare TestFlight changelog
        run: |
          {
            echo "TESTFLIGHT_CHANGELOG<<EOF"
            git log -1 --pretty=%B
            echo
            echo "Commit: ${GITHUB_SHA::7}"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Upload and distribute with Fastlane
        run: bundle exec fastlane ios testflight
