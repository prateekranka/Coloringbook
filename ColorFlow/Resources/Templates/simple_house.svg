<?xml version="1.0" encoding="UTF-8"?>
<!-- Simple House — Architecture template for ColorFlow -->
<!-- All paths have id attributes → fillable regions -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Sky background -->
  <rect id="sky" x="0" y="0" width="2048" height="1350" stroke="black" stroke-width="3" fill="none"/>

  <!-- Sun -->
  <circle id="sun" cx="300" cy="260" r="170" stroke="black" stroke-width="3" fill="none"/>

  <!-- Cloud left -->
  <path id="cloud_left" stroke="black" stroke-width="3" fill="none"
    d="M 560,320 C 560,260 600,220 660,220 C 680,180 730,160 780,175
       C 800,145 840,130 880,145 C 920,130 960,150 970,195
       C 1020,200 1050,240 1040,285 C 1040,310 1010,330 970,335
       L 590,335 C 565,335 548,330 548,310 Z"/>

  <!-- Cloud right -->
  <path id="cloud_right" stroke="black" stroke-width="3" fill="none"
    d="M 1350,220 C 1350,165 1390,130 1440,130 C 1458,95 1505,78 1550,92
       C 1570,65 1610,52 1648,66 C 1685,52 1722,70 1730,112
       C 1775,117 1800,152 1790,192 C 1790,215 1762,232 1726,237
       L 1370,237 C 1348,237 1334,231 1334,214 Z"/>

  <!-- Lawn / ground -->
  <rect id="lawn" x="0" y="1350" width="2048" height="698" stroke="black" stroke-width="3" fill="none"/>

  <!-- Path / driveway -->
  <rect id="driveway" x="974" y="1350" width="100" height="400" stroke="black" stroke-width="3" fill="none"/>

  <!-- Left garden bed -->
  <path id="garden_left" stroke="black" stroke-width="3" fill="none"
    d="M 80,1290 L 480,1290 L 480,1380 C 480,1400 460,1410 440,1410
       L 120,1410 C 100,1410 80,1400 80,1380 Z"/>

  <!-- Right garden bed -->
  <path id="garden_right" stroke="black" stroke-width="3" fill="none"
    d="M 1568,1290 L 1968,1290 L 1968,1380 C 1968,1400 1948,1410 1928,1410
       L 1608,1410 C 1588,1410 1568,1400 1568,1380 Z"/>

  <!-- Chimney (drawn before roof so roof overlaps it) -->
  <rect id="chimney" x="1340" y="480" width="130" height="310" stroke="black" stroke-width="3" fill="none"/>

  <!-- Roof -->
  <polygon id="roof" points="400,860 1024,310 1648,860" stroke="black" stroke-width="3" fill="none"/>

  <!-- House main wall -->
  <rect id="house_wall" x="400" y="860" width="1248" height="490" stroke="black" stroke-width="3" fill="none"/>

  <!-- Front door -->
  <path id="door" stroke="black" stroke-width="3" fill="none"
    d="M 924,1350 L 924,1050 C 924,1030 934,1020 954,1020
       L 1094,1020 C 1114,1020 1124,1030 1124,1050 L 1124,1350 Z"/>

  <!-- Door knob -->
  <circle id="door_knob" cx="908" cy="1200" r="18" stroke="black" stroke-width="3" fill="none"/>

  <!-- Left window frame -->
  <rect id="window_left" x="530" y="940" width="240" height="200" rx="8" ry="8"
        stroke="black" stroke-width="3" fill="none"/>

  <!-- Left window pane divider (horizontal) -->
  <path id="window_left_cross_h" stroke="black" stroke-width="3" fill="none"
    d="M 530,1040 L 770,1040"/>

  <!-- Left window pane divider (vertical) -->
  <path id="window_left_cross_v" stroke="black" stroke-width="3" fill="none"
    d="M 650,940 L 650,1140"/>

  <!-- Left window top-left pane -->
  <rect id="pane_ll_tl" x="534" y="944" width="112" height="92" stroke="none" fill="none"/>
  <!-- Left window top-right pane -->
  <rect id="pane_ll_tr" x="654" y="944" width="112" height="92" stroke="none" fill="none"/>
  <!-- Left window bottom-left pane -->
  <rect id="pane_ll_bl" x="534" y="1044" width="112" height="92" stroke="none" fill="none"/>
  <!-- Left window bottom-right pane -->
  <rect id="pane_ll_br" x="654" y="1044" width="112" height="92" stroke="none" fill="none"/>

  <!-- Right window frame -->
  <rect id="window_right" x="1278" y="940" width="240" height="200" rx="8" ry="8"
        stroke="black" stroke-width="3" fill="none"/>

  <!-- Right window pane divider (horizontal) -->
  <path id="window_right_cross_h" stroke="black" stroke-width="3" fill="none"
    d="M 1278,1040 L 1518,1040"/>

  <!-- Right window pane divider (vertical) -->
  <path id="window_right_cross_v" stroke="black" stroke-width="3" fill="none"
    d="M 1398,940 L 1398,1140"/>

  <!-- Right window panes (fillable) -->
  <rect id="pane_rr_tl" x="1282" y="944" width="112" height="92" stroke="none" fill="none"/>
  <rect id="pane_rr_tr" x="1402" y="944" width="112" height="92" stroke="none" fill="none"/>
  <rect id="pane_rr_bl" x="1282" y="1044" width="112" height="92" stroke="none" fill="none"/>
  <rect id="pane_rr_br" x="1402" y="1044" width="112" height="92" stroke="none" fill="none"/>

  <!-- Chimney smoke puff 1 -->
  <circle id="smoke_1" cx="1375" cy="420" r="50" stroke="black" stroke-width="3" fill="none"/>
  <!-- Chimney smoke puff 2 -->
  <circle id="smoke_2" cx="1420" cy="340" r="70" stroke="black" stroke-width="3" fill="none"/>
  <!-- Chimney smoke puff 3 -->
  <circle id="smoke_3" cx="1370" cy="260" r="55" stroke="black" stroke-width="3" fill="none"/>

</svg>
