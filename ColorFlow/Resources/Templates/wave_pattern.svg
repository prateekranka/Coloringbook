<?xml version="1.0" encoding="UTF-8"?>
<!-- Japanese Seigaiha (blue-wave) pattern -->
<!-- Each scale is a semicircle built from two cubic bezier curves -->
<!-- Semicircle formula: for a circle of radius r centered at (cx, cy),
     the top half from left to right uses two bezier curves.
     A unit semicircle from (-1,0) to (1,0) over the top:
     CP1: (-1, -0.5523), (-0.5523, -1) -> (0,-1) -> (0.5523,-1) -> (1,-0.5523) -> (1,0)
     Scaled to radius r: kappa = 0.5523 * r -->
<!-- Scale size: radius=220, full width=440, full height=220 -->
<!-- Grid: cols offset by 220 each row, row height=165 (3/4 of 220) -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048" width="2048" height="2048">

  <!-- Row 0: y=220 (bottom of first row), centers at y=220, x = 220, 660, 1100, 1540, 1980 -->
  <!-- Each scale: left point (cx-220, cy), right point (cx+220, cy), top (cx, cy-220) -->
  <!-- Bezier kappa for r=220: 0.5523*220 = 121.5 -->

  <path id="w_r0c0" fill="none" stroke="black" stroke-width="3"
    d="M0,220 C0,98 98,0 220,0 C342,0 440,98 440,220 Z"/>
  <path id="w_r0c1" fill="none" stroke="black" stroke-width="3"
    d="M440,220 C440,98 538,0 660,0 C782,0 880,98 880,220 Z"/>
  <path id="w_r0c2" fill="none" stroke="black" stroke-width="3"
    d="M880,220 C880,98 978,0 1100,0 C1222,0 1320,98 1320,220 Z"/>
  <path id="w_r0c3" fill="none" stroke="black" stroke-width="3"
    d="M1320,220 C1320,98 1418,0 1540,0 C1662,0 1760,98 1760,220 Z"/>
  <path id="w_r0c4" fill="none" stroke="black" stroke-width="3"
    d="M1760,220 C1760,98 1858,0 1980,0 C2102,0 2200,98 2200,220 Z"/>

  <!-- Row 1: offset by 220, y base = 385 (220 + 165) -->
