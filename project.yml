# XcodeGen project spec for ColorFlow
# Install: brew install xcodegen
# Usage:   xcodegen generate   (run from repo root)
# Then:    open ColorFlow.xcodeproj

name: ColorFlow

options:
  bundleIdPrefix: com.colorflow
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true   # mirrors folder structure in Xcode sidebar

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SUPPORTS_MACCATALYST: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  ColorFlow:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    # ── Source files ─────────────────────────────────────────────────────────
    sources:
      - path: ColorFlow
        excludes:
          - "Package.swift"
          - "Scripts/**"
          - "Assets.xcassets/**"   # bundled via resources below
          - "Resources/**"         # bundled via resources below

    # ── Bundle resources ─────────────────────────────────────────────────────
    resources:
      - path: ColorFlow/Assets.xcassets
      - path: ColorFlow/Resources/templates.json
      - path: ColorFlow/Resources/Palettes/palettes.json
      - path: ColorFlow/Resources/Templates          # SVG template files
      - path: ColorFlow/PrivacyInfo.xcprivacy        # Required for App Store submission

    # ── Build settings ───────────────────────────────────────────────────────
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.colorflow.app
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ColorFlow/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"

        # Code signing — replace XXXXXXXXXX with your 10-character Apple Developer Team ID
        # Find it at: https://developer.apple.com/account (Membership Details)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XXXXXXXXXX
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: ColorFlow/ColorFlow.entitlements

        # Linker flags (none needed currently — SVGKit is stubbed out)
        OTHER_LDFLAGS: ""

      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ENABLE_TESTABILITY: "YES"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: "YES"
          ENABLE_TESTABILITY: "NO"

schemes:
  ColorFlow:
    build:
      targets:
        ColorFlow: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
