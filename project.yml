# XcodeGen project spec for ColorFlow
# Install: brew install xcodegen
# Usage:   xcodegen generate   (run from repo root)
# Then:    open ColorFlow.xcodeproj

name: ColorFlow

options:
  bundleIdPrefix: com.colorflow
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true   # mirrors folder structure in Xcode sidebar

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SUPPORTS_MACCATALYST: "NO"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ALWAYS_SEARCH_USER_PATHS: "NO"

targets:
  ColorFlow:
    type: application
    platform: iOS
    deploymentTarget: "18.0"

    # ── Source files ─────────────────────────────────────────────────────────
    sources:
      - path: ColorFlow
        excludes:
          - "Package.swift"
          - "Scripts/**"
          - "Resources/**"         # bundled via resources below
          - ".build/**"            # stray SwiftPM cache — never belongs in the app target

    # ── Bundle resources ─────────────────────────────────────────────────────
    resources:
      - path: ColorFlow/Resources/templates.json
      - path: ColorFlow/Resources/Palettes/palettes.json
      - path: ColorFlow/Resources/Fonts
      - path: ColorFlow/PrivacyInfo.xcprivacy        # Required for App Store submission
      # CoreML model directory (populated after running Scripts/coreml/convert_informative_drawings.py)
      # - path: ColorFlow/Resources/Models            # Uncomment after model is converted

    # ── Run Script: copy SVG templates into the app bundle ────────────────
    # xcodegen does not reliably add .svg files to Copy Bundle Resources,
    # so we use an explicit script to guarantee they land in the bundle root
    # where Bundle.main.url(forResource:withExtension:) can find them.
    preBuildScripts:
      - name: "Copy SVG Templates"
        script: |
          set -e
          DEST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}"
          mkdir -p "${DEST}"
          for SVG in "${SRCROOT}/ColorFlow/Resources/Templates/"*.svg; do
            cp -f "${SVG}" "${DEST}/"
          done
          if [ -f "${SRCROOT}/ColorFlow/Resources/templates.json" ]; then
            cp -f "${SRCROOT}/ColorFlow/Resources/templates.json" "${DEST}/"
          fi
          if [ -f "${SRCROOT}/ColorFlow/Resources/Palettes/palettes.json" ]; then
            cp -f "${SRCROOT}/ColorFlow/Resources/Palettes/palettes.json" "${DEST}/"
          fi
          if [ -f "${SRCROOT}/ColorFlow/Resources/Fonts/Fraunces.ttf" ]; then
            cp -f "${SRCROOT}/ColorFlow/Resources/Fonts/Fraunces.ttf" "${DEST}/"
          fi
        shell: /bin/sh
        basedOnDependencyAnalysis: false

    # ── Build settings ───────────────────────────────────────────────────────
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckuwucky.sable
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ColorFlow/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "2"

        # Code signing
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: ColorFlow/ColorFlow.entitlements

        # System frameworks auto-linked on iOS — explicit for clarity
        # Vision, MetalPerformanceShaders, CoreML are used by the photo pipeline (Phase C).
        OTHER_LDFLAGS: ""

      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ENABLE_TESTABILITY: "YES"
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          VALIDATE_PRODUCT: "YES"
          ENABLE_TESTABILITY: "NO"

  ColorFlowTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ColorFlowTests
    dependencies:
      - target: ColorFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.colorflow.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "2"
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic

  ColorFlowUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ColorFlowUITests
    dependencies:
      - target: ColorFlow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prateekranka.colorflow.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "2"
        DEVELOPMENT_TEAM: 4JRB53LG5C
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: ColorFlow
        SWIFT_STRICT_CONCURRENCY: minimal

schemes:
  ColorFlow:
    build:
      targets:
        ColorFlow: all
        ColorFlowTests: [test]
        ColorFlowUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ColorFlowTests
        - ColorFlowUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
