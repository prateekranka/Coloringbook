# ColorFlow v1 Catalog Prompt Set
#
# Category distribution follows the research document's demand analysis:
#   Mandalas 16%, Florals/Botanicals 12%, Animals 16%, Architecture 12%,
#   Abstract 12%, Lifestyle/Scenes 16%, Fantasy/Whimsy 8%, Seasonal 8%
#
# Each prompt is designed to produce:
#   - Clean line-art style with strong, closed outlines
#   - High-contrast black-on-white composition
#   - No shading or gradients (solid fills only)
#   - Coloring-book aesthetic with clear region separation
#
# Model targets: SDXL + ColoringBook LoRA, or Flux.1-dev + coloring-book
# style prompt. Negative prompts reduce photorealism and blurriness.
#
# Usage by 02_vectorize.py: each entry generates one raster PNG input.
# Target: 60 images → 50+ validator-passing SVGs (some attrition expected).
#
# Total prompts: 60 (weighted by category share)

metadata:
  version: "1.0"
  target_count: 60
  image_size: "1024x1024"
  model: "sdxl"
  lora: "coloringbook-v1"
  style_prefix: "coloring book page, black and white line art, clear outlines, no shading, no fill, white background, bold lines,"
  negative_prompt: "photograph, realistic, shading, gradient, blur, gray, color, shadow, 3d render, painting"

# ── Mandalas (16% → 10 images) ─────────────────────────────────────────────
categories:
  - name: Mandalas
    count: 10
    difficulty_distribution:
      easy: 2
      medium: 5
      hard: 3
    prompts:
      - name: "sunflower_mandala"
        display_name: "Sunflower Mandala"
        difficulty: easy
        prompt: "sunflower mandala, circular symmetry, large petals radiating from center, concentric rings of simple geometric shapes"
      - name: "celtic_knot_mandala"
        display_name: "Celtic Knot Mandala"
        difficulty: hard
        prompt: "celtic knot mandala, interlocking continuous loops, triquetra motifs, dense interwoven pattern with clean enclosed regions"
      - name: "geometric_star_mandala"
        display_name: "Geometric Star Mandala"
        difficulty: medium
        prompt: "geometric star mandala, eight-pointed star, nested polygons, angular symmetry, clean bold outlines"
      - name: "peacock_feather_mandala"
        display_name: "Peacock Feather Mandala"
        difficulty: medium
        prompt: "peacock feather mandala, teardrop eye shapes, fanning feather barbs, circular arrangement, ornate detail"
      - name: "lotus_flower_mandala"
        display_name: "Lotus Flower Mandala"
        difficulty: medium
        prompt: "lotus mandala, twelve petals per ring, three concentric rings, lotus buds at cardinal points, serene symmetry"
      - name: "art_deco_mandala"
        display_name: "Art Deco Mandala"
        difficulty: medium
        prompt: "art deco mandala, chevrons, fans, stepped geometric forms, 1920s decorative motifs, strong angular symmetry"
      - name: "snowflake_mandala"
        display_name: "Snowflake Mandala"
        difficulty: easy
        prompt: "snowflake mandala, six-fold symmetry, crystalline branches, simple rectangular arms with forked tips"
      - name: "spider_web_mandala"
        display_name: "Spider Web Mandala"
        difficulty: medium
        prompt: "spider web mandala, concentric hexagonal rings, radial spokes, spiral web path, dew drops at intersections"
      - name: "hamsa_hand_mandala"
        display_name: "Hamsa Mandala"
        difficulty: hard
        prompt: "hamsa hand mandala, evil eye motif at center, hamsa hand silhouette, intricate floral fill inside hand shape"
      - name: "tribal_sun_mandala"
        display_name: "Tribal Sun Mandala"
        difficulty: hard
        prompt: "tribal sun mandala, bold tribal marks, irregular spiky rays, totemic animal motifs in each segment"

