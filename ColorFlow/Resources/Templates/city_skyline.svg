  <rect id="bldg_4_w2" x="870" y="800" width="60" height="55" stroke="black" stroke-width="2" fill="none"/>
  <rect id="bldg_4_w3" x="976" y="800" width="60" height="55" stroke="black" stroke-width="2" fill="none"/>
